[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patientseg"
version = "0.1.0"
description = "Medicare beneficiary segmentation on CMS DE-SynPUF"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "plotly>=5.22",
    "dash>=2.17",
    "requests>=2.32",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
